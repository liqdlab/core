<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIQD LAB Sales</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f4f4f1;color:#171717;font:16px Arial}.wrap{max-width:520px;margin:auto}.brand{font-weight:800;letter-spacing:3px;font-size:23px;margin:8px 0}.sub{font-size:12px;color:#666;margin-bottom:16px}.card{background:white;border:1px solid #e5e5e5;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:14px;font-weight:700;cursor:pointer}.dark{background:#171717;color:white;width:100%}.green{background:#e5f4e8}.red{background:#fae8e7}input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;background:white}label{display:block;margin:12px 0 6px;font-size:13px;color:#555}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.qty{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}.qty input{text-align:center;font-size:20px;font-weight:bold}.status{white-space:pre-wrap;background:#f2f2f2;padding:11px;border-radius:10px;font-size:13px;margin-top:10px}.muted{font-size:12px;color:#666}.hidden{display:none}.name{font-size:18px;font-weight:bold;margin:6px 0}
</style></head><body><div class="wrap"><div class="brand">LIQD LAB</div><div class="sub">BARCODE • SALES • INVENTORY</div>
<div class="card"><button class="dark" onclick="startScan()">SCAN BARCODE WITH CAMERA</button><div id="reader" class="hidden" style="margin-top:12px"></div>
<label>Or enter barcode manually</label><div class="row"><input id="barcode" placeholder="Barcode number"><button onclick="lookup()" class="dark">Find</button></div><div id="status" class="status">Ready to scan.</div></div>
<div id="productCard" class="card hidden"><div class="muted">PRODUCT FOUND</div><div id="name" class="name"></div><div id="meta" class="muted"></div>
<label>Transaction</label><select id="type"><option value="SALE">SALE — deduct stock</option><option value="RESTOCK">RESTOCK — add stock</option><option value="RETURN">RETURN — add stock</option><option value="ADJUSTMENT">SET STOCK — exact quantity</option></select>
<label>Quantity (default 1)</label><div class="qty"><button class="green" onclick="step(-1)">−</button><input id="qty" type="number" min="1" value="1"><button class="green" onclick="step(1)">+</button></div>
<label>Unit selling price (₹)</label><input id="price" type="number" min="0" step=".01"><label>Notes</label><input id="notes" placeholder="Optional">
<p class="muted">Timestamp is automatic (India time). GPS is requested when saving. If location is denied, transaction still saves without GPS.</p><button class="dark" onclick="save()">CONFIRM TRANSACTION</button></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwFhK1HaEYDtbqGrYo7PsoUqGIF3jV_Dbn-I7tEeg-wW30PtlaIbGCouB5ky_1dlWs_/exec';
let product=null,scanner=null;
const el=id=>document.getElementById(id),status=t=>el('status').textContent=t;
function api(params){
  if(!API_URL || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) return Promise.reject(new Error('Apps Script API URL is not configured.'));
  return new Promise((resolve,reject)=>{
    const cb='liqdcb'+Date.now()+Math.floor(Math.random()*1000),s=document.createElement('script');
    let done=false;
    const cleanup=()=>{if(done)return;done=true;delete window[cb];s.remove();clearTimeout(timer)};
    const timer=setTimeout(()=>{cleanup();reject(new Error('Google Sheets API timed out. Check Apps Script deployment access.'))},15000);
    params.callback=cb;
    window[cb]=d=>{cleanup();d&&d.ok?resolve(d):reject(new Error(d&&d.error?d.error:'Request failed'))};
    s.onerror=()=>{cleanup();reject(new Error('Could not reach Google Sheets API. Check API URL and deployment access.'))};
    s.src=API_URL+'?'+new URLSearchParams(params).toString();document.body.appendChild(s);
  });
}
async function lookup(){let b=el('barcode').value.trim();if(!b)return status('Enter or scan a barcode.');status('Looking up…');try{let r=await api({action:'lookup',barcode:b});product=r.product;el('name').textContent=product.name+' — '+product.variant;el('meta').textContent='SKU: '+product.sku+' • Stock: '+product.stock;el('price').value=product.price;el('qty').value=1;el('type').value='SALE';el('productCard').classList.remove('hidden');status('Product ready.\nQuantity defaults to 1.')}catch(e){el('productCard').classList.add('hidden');status(e.message)}}
function step(n){el('qty').value=Math.max(1,parseInt(el('qty').value||1)+n)}
async function startScan(){if(!window.isSecureContext){status('Camera requires an HTTPS website.');return}if(!window.Html5Qrcode){status('Scanner library did not load. Check your internet connection and refresh.');return}el('reader').classList.remove('hidden');if(scanner)return;try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:130}},async text=>{el('barcode').value=text;await scanner.stop();scanner=null;el('reader').classList.add('hidden');lookup()},()=>{})}catch(e){status('Camera error: '+e+'\nAllow camera permission for this website in Chrome site settings.');scanner=null}}
function location(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve({});navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),()=>resolve({}),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})})}
async function save(){if(!product)return status('Find a product first.');let q=Number(el('qty').value);if(!Number.isInteger(q)||q<1)return status('Quantity must be at least 1.');status('Requesting location and saving…');let loc=await location();try{let r=await api({action:'save',barcode:product.barcode,type:el('type').value,qty:q,price:el('price').value,lat:loc.lat??'',lng:loc.lng??'',device:navigator.userAgent,notes:el('notes').value});el('meta').textContent='SKU: '+product.sku+' • Stock: '+r.stock;el('qty').value=1;status('Saved • '+r.timestamp+' IST\nStock now: '+r.stock+'\nAmount: ₹'+r.amount+(loc.lat?'\nGPS captured.':'\nGPS unavailable; saved without location.'))}catch(e){status('Not saved: '+e.message)}}
</script></body></html>

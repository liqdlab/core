<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIQD LAB Code 128 Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#171717;font:16px Arial,sans-serif;padding:16px}
main{max-width:560px;margin:auto}.brand{font-size:23px;font-weight:800;letter-spacing:3px;margin:8px 0}.muted{font-size:12px;color:#666}
.panel{background:white;border:1px solid #e2e2df;border-radius:16px;padding:16px;margin:14px 0}
h2{font-size:16px;margin:0 0 12px}button,input{font:inherit}button{border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer}
.primary{background:#171717;color:white;width:100%}.secondary{background:#e8e8e4;color:#171717}
#scanner{margin-top:14px}#scanner video{width:100%!important;border-radius:12px}
#scanner__dashboard{padding:10px 0}#scanner__dashboard_section_csr button{background:#171717;color:white;margin:4px}
#scanner__dashboard_section_csr select{padding:9px;border-radius:8px;max-width:100%}
#scanner__scan_region{position:relative;min-height:220px;border-radius:12px;overflow:hidden;background:#111}
#scanner__scan_region img{display:none!important}
#scanner__scan_region video{object-fit:cover}
.scan-help{display:flex;gap:8px;align-items:center;margin:10px 0;color:#555;font-size:13px}
.scan-icon{width:9px;height:9px;border-radius:50%;background:#13a36d;display:inline-block}
label{display:block;margin:12px 0 6px;font-size:13px;color:#555}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}.status{white-space:pre-wrap;background:#f1f1ee;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}
.hidden{display:none!important}.success{border-left:4px solid #159766;padding-left:12px}
</style>
</head>
<body><main>
<div class="brand">LIQD LAB</div><div class="muted">CODE 128 BARCODE SALES SCANNER</div>
<section class="panel">
<h2>Barcode scanner</h2>
<div class="muted">Code 128 ONLY. Numeric EAN/UPC formats are disabled to prevent other numeric barcodes being selected.</div>
<div id="scanner"></div>
<div class="scan-help"><span class="scan-icon"></span><span>Place the complete barcode inside the scan frame. Hold steady until it reads.</span></div>
<div id="status" class="status">Scanner loading…</div><div id="decoded" class="status hidden"><b>Decoded Code 128:</b><br><span id="decodedValue"></span></div>
</section>
<section class="panel">
<h2>Manual entry fallback</h2>
<label for="barcode">Barcode text</label>
<div class="row"><input id="barcode" placeholder="product name-30 or product name-50"><button id="manual" class="secondary">Record</button></div>
</section>
<section id="result" class="panel hidden success">
<strong id="resultText"></strong><div id="resultMeta" class="muted"></div>
</section>
</main>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbwFhK1HaEYDtbqGrYo7PsoUqGIF3jV_Dbn-I7tEeg-wW30PtlaIbGCouB5ky_1dlWs_/exec';
const $=id=>document.getElementById(id);
let scannerWidget=null,recording=false,lastValue='',lastAt=0;
function status(t){$('status').textContent=t;}
function api(params){
 return new Promise((resolve,reject)=>{
  const cb='liqd_'+Date.now()+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script');
  const timer=setTimeout(()=>{clean();reject(new Error('API timed out.'));},15000);
  function clean(){clearTimeout(timer);delete window[cb];s.remove();}
  window[cb]=d=>{clean();d&&d.ok?resolve(d):reject(new Error(d&&d.error||'API error'));};
  s.onerror=()=>{clean();reject(new Error('Could not connect to Apps Script.'));};
  params.callback=cb;s.src=API_URL+'?'+new URLSearchParams(params).toString();document.body.appendChild(s);
 });
}
function parse(raw){
 const v=String(raw||'').trim(),m=v.match(/^(.*)-\s*(30|50)$/i);
 if(!m||!m[1].trim())throw new Error('Barcode must end in -30 or -50.');
 return {barcode:v,product:m[1].trim(),size:m[2]};
}
function gps(){
 return new Promise(resolve=>{
  if(!navigator.geolocation)return resolve({});
  navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),()=>resolve({}),{enableHighAccuracy:true,timeout:7000,maximumAge:60000});
 });
}
async function record(raw){
 if(recording)return;recording=true;
 try{
  const p=parse(raw);status('Detected '+p.barcode+'. Recording sale…');
  const loc=await gps();
  const d=await api({action:'sale',barcode:p.barcode,product:p.product,size:p.size,lat:loc.lat??'',lng:loc.lng??'',device:(navigator.userAgent||'').slice(0,160)});
  $('resultText').textContent=p.product+' · '+p.size+' ml';
  $('resultMeta').textContent='Sales count: '+d.count+' · '+d.timestamp+' IST'+(loc.lat!==undefined?' · Location logged':' · Location unavailable');
  $('result').classList.remove('hidden');status('Sale recorded successfully.');
 }catch(e){status('Not recorded: '+e.message);}
 finally{recording=false;}
}
function onScanSuccess(decodedText){
 const now=Date.now();if(recording||decodedText===lastValue&&now-lastAt<3000)return;
 lastValue=decodedText;lastAt=now;$('barcode').value=decodedText;$('decodedValue').textContent=decodedText;$('decoded').classList.remove('hidden');if(!/^(.*)-\s*(30|50)$/i.test(decodedText.trim())){status('Code 128 detected, but it does not end in -30 or -50. Check the barcode content.');return;}record(decodedText);
}
function start(){
 if(!window.isSecureContext){status('Open this page over HTTPS to use the camera.');return;}
 if(!window.Html5QrcodeScanner){status('Scanner library failed to load. Check internet connection and refresh.');return;}
 const F=Html5QrcodeSupportedFormats;
 const formats=[F.CODE_128]; // Deliberately Code 128 ONLY: ignore numeric EAN/UPC barcodes.
 scannerWidget=new Html5QrcodeScanner('scanner',{
  fps:12,
  qrbox:{width:Math.min(420,Math.max(260,window.innerWidth-100)),height:150},
  aspectRatio:2.0,
  rememberLastUsedCamera:true,
  showTorchButtonIfSupported:true,
  showZoomSliderIfSupported:true,
  formatsToSupport:formats,
  videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
 },false);
 scannerWidget.render(onScanSuccess,()=>{});
 status('Scanner ready. Select the rear camera if prompted, then aim at the barcode.');
}
$('manual').addEventListener('click',()=>record($('barcode').value));
$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter')record($('barcode').value);});
start();
</script></body></html>

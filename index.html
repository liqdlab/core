<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIQD LAB Sales Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f4f4f1;color:#171717;font:16px Arial}.wrap{max-width:520px;margin:auto}.brand{font-weight:800;letter-spacing:3px;font-size:23px;margin:8px 0}.sub{font-size:12px;color:#666;margin-bottom:16px}.card{background:white;border:1px solid #e5e5e5;border-radius:16px;padding:16px;margin:12px 0}button,input{font:inherit}button{border:0;border-radius:10px;padding:14px;font-weight:700;cursor:pointer}.dark{background:#171717;color:white;width:100%}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px}label{display:block;margin:12px 0 6px;font-size:13px;color:#555}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.status{white-space:pre-wrap;background:#f2f2f2;padding:11px;border-radius:10px;font-size:13px;margin-top:10px}.muted{font-size:12px;color:#666}.hidden{display:none}#reader{width:100%;}#reader video{width:100%!important;border-radius:12px;}#reader__scan_region{min-height:190px;}#reader__dashboard{padding:8px 0;}#reader button{background:#171717;color:white;margin:5px;}#reader select{max-width:100%;padding:8px;border-radius:8px;} .name{font-size:18px;font-weight:bold;margin:6px 0}</style></head>
<body><div class="wrap"><div class="brand">LIQD LAB</div><div class="sub">BARCODE • SALES RECORDING</div>
<div class="card"><button class="dark" onclick="startScan()">SCAN BARCODE WITH CAMERA</button><div id="reader" class="hidden" style="margin-top:12px"></div><label>Or enter barcode manually</label><div class="row"><input id="barcode" placeholder="e.g. yum pistachio gelato 33-30"><button onclick="record()" class="dark">Record</button></div><div id="status" class="status">Ready to scan.</div></div>
<div id="result" class="card hidden"><div class="muted">SALE RECORDED</div><div id="name" class="name"></div><div id="detail" class="muted"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwFhK1HaEYDtbqGrYo7PsoUqGIF3jV_Dbn-I7tEeg-wW30PtlaIbGCouB5ky_1dlWs_/exec'; let scanner=null, busy=false;
const el=id=>document.getElementById(id), status=t=>el('status').textContent=t;
function api(params){
 if(!API_URL || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) return Promise.reject(new Error('Apps Script API URL is not configured.'));
 return new Promise((resolve,reject)=>{const cb='liqdcb'+Date.now()+Math.floor(Math.random()*1000),s=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;delete window[cb];s.remove();clearTimeout(timer)};const timer=setTimeout(()=>{cleanup();reject(new Error('API timed out.'))},20000);params.callback=cb;window[cb]=d=>{cleanup();d&&d.ok?resolve(d):reject(new Error(d&&d.error?d.error:'Request failed'))};s.onerror=()=>{cleanup();reject(new Error('Could not reach Apps Script API.'))};s.src=API_URL+'?'+new URLSearchParams(params).toString();document.body.appendChild(s)});
}
function parseBarcode(s){const m=String(s||'').trim().match(/^(.*)-(30|50)$/i);return m?{name:m[1].trim(),size:m[2]}:null}
async function record(){if(busy)return;const barcode=el('barcode').value.trim(),parsed=parseBarcode(barcode);if(!parsed)return status('Barcode must end in -30 or -50.');busy=true;status('Capturing location and recording sale…');const loc=await getLocation();try{const r=await api({action:'save',barcode,lat:loc.lat??'',lng:loc.lng??'',device:navigator.userAgent});el('name').textContent=r.product;el('detail').textContent='Size: '+r.size+' ml • Total sales for this size: '+r.count+' • '+r.timestamp+' IST'+(r.locationSaved?' • Location logged':' • Location unavailable');el('result').classList.remove('hidden');status('Sale successfully recorded.');el('barcode').value='';}catch(e){status('Not recorded: '+e.message)}finally{busy=false}}
function getLocation(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve({});navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),()=>resolve({}),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})})}
async function startScan(){
  if(!window.isSecureContext){status('Camera requires HTTPS.');return;}
  if(!window.Html5QrcodeScanner || !window.Html5QrcodeSupportedFormats){
    status('Barcode scanner library did not load. Check internet and refresh.');
    return;
  }
  if(scanner) return;
  el('reader').classList.remove('hidden');
  status('Opening barcode scanner…');
  try{
    const F=Html5QrcodeSupportedFormats;
    const formats=[
      F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,
      F.UPC_A,F.UPC_E,F.ITF,F.QR_CODE
    ].filter(v=>v!==undefined);
    scanner=new Html5QrcodeScanner('reader',{
      fps:12,
      qrbox:{width:320,height:160},
      aspectRatio:1.7777778,
      rememberLastUsedCamera:true,
      showTorchButtonIfSupported:true,
      showZoomSliderIfSupported:true,
      formatsToSupport:formats,
      videoConstraints:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    },false);
    scanner.render(async decodedText=>{
      if(busy) return;
      el('barcode').value=decodedText;
      status('Barcode detected: '+decodedText+'\nRecording sale…');
      try{await scanner.clear();}catch(e){}
      scanner=null;
      el('reader').classList.add('hidden');
      await record();
    },()=>{});
    status('Scanner ready. Place the complete barcode inside the scan box.');
  }catch(e){
    status('Scanner error: '+(e&&e.message?e.message:e));
    if(scanner){try{await scanner.clear();}catch(x){}}
    scanner=null;
  }
}
</script></body></html>
